<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        font-family: "Tajawal", sans-serif;
        background: #0b1220;
      }
      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        color: #fff;
        background:
          radial-gradient(
            ellipse 100% 90% at 85% -10%,
            rgba(45, 212, 191, 0.4),
            transparent 55%
          ),
          radial-gradient(
            ellipse 80% 70% at -5% 110%,
            rgba(56, 189, 248, 0.22),
            transparent 50%
          ),
          linear-gradient(150deg, #0d9488 0%, #0f766e 34%, #134e4a 62%, #0f172a 100%);
      }
      .grid {
        position: absolute;
        inset: 0;
        opacity: 0.07;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.55) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.55) 1px, transparent 1px);
        background-size: 48px 48px;
        mask-image: radial-gradient(circle at 60% 40%, black 20%, transparent 75%);
      }
      .orb {
        position: absolute;
        border-radius: 999px;
        filter: blur(56px);
        pointer-events: none;
      }
      .orb-a {
        width: 480px;
        height: 480px;
        top: -160px;
        right: -80px;
        background: rgba(94, 234, 212, 0.35);
      }
      .orb-b {
        width: 380px;
        height: 380px;
        bottom: -160px;
        left: -40px;
        background: rgba(34, 211, 238, 0.18);
      }
      .ring {
        position: absolute;
        left: 72px;
        bottom: 72px;
        width: 236px;
        height: 236px;
        border-radius: 50%;
        border: 2px solid rgba(153, 246, 228, 0.35);
        box-shadow:
          0 0 0 18px rgba(20, 184, 166, 0.07),
          inset 0 0 60px rgba(45, 212, 191, 0.12);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(
          circle at 40% 35%,
          rgba(45, 212, 191, 0.28),
          rgba(15, 23, 42, 0.08) 72%
        );
      }
      .ring strong {
        font-size: 78px;
        font-weight: 800;
        line-height: 0.95;
      }
      .ring span {
        margin-top: 4px;
        font-size: 26px;
        font-weight: 700;
        color: #99f6e4;
      }
      .inner {
        position: relative;
        z-index: 2;
        height: 100%;
        padding: 58px 68px 52px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .mark {
        width: 68px;
        height: 68px;
        border-radius: 22px;
        background: linear-gradient(145deg, #5eead4, #14b8a6);
        box-shadow: 0 16px 36px rgba(13, 148, 136, 0.5);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 36px;
        font-weight: 800;
        color: #042f2e;
      }
      .brand-name {
        font-size: 46px;
        font-weight: 800;
        line-height: 1;
      }
      .badge {
        padding: 12px 24px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.2);
        font-size: 22px;
        font-weight: 700;
        color: #ecfeff;
      }
      .mid {
        max-width: 760px;
        margin-right: 0;
        margin-left: auto;
        text-align: right;
      }
      .kicker {
        display: inline-flex;
        padding: 8px 16px;
        border-radius: 999px;
        background: rgba(15, 23, 42, 0.28);
        border: 1px solid rgba(94, 234, 212, 0.35);
        font-size: 22px;
        font-weight: 700;
        color: #5eead4;
        margin-bottom: 20px;
      }
      .title {
        font-size: 70px;
        font-weight: 800;
        line-height: 1.16;
        letter-spacing: -0.03em;
        text-shadow: 0 12px 40px rgba(0, 0, 0, 0.28);
      }
      .sub {
        margin-top: 22px;
        font-size: 28px;
        font-weight: 500;
        line-height: 1.55;
        color: rgba(204, 251, 241, 0.95);
        max-width: 720px;
      }
      .bottom {
        display: flex;
        align-items: center;
        gap: 12px;
        justify-content: flex-start;
        padding-left: 300px;
      }
      .pill {
        padding: 13px 20px;
        border-radius: 16px;
        background: rgba(15, 23, 42, 0.42);
        border: 1px solid rgba(255, 255, 255, 0.14);
        font-size: 22px;
        font-weight: 700;
        color: #f0fdfa;
        white-space: nowrap;
      }
      .pill em {
        font-style: normal;
        color: #5eead4;
        font-weight: 800;
        margin-left: 6px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="grid"></div>
      <div class="orb orb-a"></div>
      <div class="orb orb-b"></div>
      <div class="ring" aria-hidden="true">
        <strong>٦٠</strong>
        <span>دقيقة</span>
      </div>
      <div class="inner">
        <div class="top">
          <div class="brand">
            <div class="mark">ق</div>
            <div class="brand-name">قُدرة</div>
          </div>
          <div class="badge">مجاني بالكامل</div>
        </div>
        <div class="mid">
          <div class="kicker">اختبار القدرات — القسم الكمي</div>
          <div class="title">افهم بالتفاعل<br />مو بالحفظ</div>
          <div class="sub">
            كل مهارة مبنية على تصوّر تفاعلي — جرّب الفكرة بنفسك، ثم اختصار وتدريب
            واختبار موقوت
          </div>
        </div>
        <div class="bottom">
          <div class="pill">تصوّر تفاعلي</div>
          <div class="pill"><em>٦٠</em>مهارة</div>
          <div class="pill"><em>٦٠</em>سؤال</div>
          <div class="pill">اختبار كامل</div>
        </div>
      </div>
    </div>
  </body>
</html>
